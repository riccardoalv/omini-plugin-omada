id: omada
name: TP-Link Omada
version: 0.3.0
protocol: 1
entrypoint: main.py
timeout_s: 120
description: >-
  TP-Link Omada Software Controller and OC200/OC300 through the official Omada
  Open API: every gateway, switch and access point of a site with ports, link
  speed, traffic counters, SFP diagnostics, LLDP and uplinks, spanning tree and
  LAGs, WANs, Wi-Fi and wired clients, VLANs, the access points' radios and
  channels, the gateway's networks and DHCP clients, CPU, memory, uptime and
  pending firmware updates; backs up each device's and the site's settings (no secrets);
  enables or disables switch ports, sets their VLANs (port profiles), creates,
  renames and deletes the site's VLAN-only networks and manages each VLAN's
  Wi-Fi networks (through the controller, which keeps the change).
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-omada
backup: true
changes:
  - port.enabled
  - port.vlans
  - vlan.set
  - vlan.delete
  - wifi.set
  - wifi.delete
fields:
  - key: url
    type: url
    label: Controller address
    required: true
    help: >-
      The controller's web interface (the Open API "Interface Access Address"),
      e.g. https://192.168.1.10:8043 for the Software Controller or
      https://192.168.1.2 for an OC200/OC300.
  - key: client_id
    type: string
    label: Client ID
    required: true
    help: >-
      Global view → Settings → Platform Integration → Open API → Add New App:
      Client mode, Administrator role to change ports, VLANs and Wi-Fi
      (Viewer only reads; see the plugin's README).
  - key: client_secret
    type: secret
    label: Client secret
    required: true
  - key: site
    type: string
    label: Site
    help: Name of the site to read; empty reads the default (or first) site.
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    group: Advanced
    help: The controller uses a self-signed certificate by default; turn this on if yours is trusted.
  - key: timeout_s
    type: int
    label: Timeout (seconds)
    default: 15
    group: Advanced
    help: How long to wait for each answer of the controller.
